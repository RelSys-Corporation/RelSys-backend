# DATASOURCE
quarkus.datasource.jdbc.url=${DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/RelSys}
quarkus.datasource.username=${DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${DATASOURCE_PASSWORD:123}

# HIBERNATE
quarkus.hibernate-orm.schema-management.strategy=validate

# FLYWAY
quarkus.flyway.enabled=true
quarkus.flyway.active=true
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=system

# BUILD
quarkus.native.additional-build-args=-march=compatibility

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins="http://localhost:4200"
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# JWT
mp.jwt.verify.issuer=${DATASOURCE_JDBC_URL:RelSys}
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

quarkus.smallrye-jwt.enabled=true