# DATASOURCE
quarkus.datasource.jdbc.url=${DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/RelSys}
quarkus.datasource.username=${DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${DATASOURCE_PASSWORD:123}
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# HIBERNATE
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# FLYWAY
quarkus.flyway.enabled=true
quarkus.flyway.active=true
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=system

# BUILD
quarkus.native.additional-build-args=-march=compatibility

# CORS
quarkus.http.host=100.86.142.29
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*
quarkus.http.access-control-allow-credentials=true

# JWT
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.issuer=${JWT_ISSUER:RelSys}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:RelSys}
smallrye.jwt.sign.key.location=C:/Program Files/RelSys/keys/jwt/privateKey.pem
mp.jwt.verify.publickey.location=C:/Program Files/RelSys/keys/jwt/publicKey.pem